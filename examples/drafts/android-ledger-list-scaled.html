<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android 账单列表 · 字号放大</title>
<style>
  * { box-sizing: border-box; }
  html { font-size: 24px; }
  body {
    margin: 0;
    background: #d5ddd8;
    color: #1a1c1b;
    font-family: Roboto, "Noto Sans", "Segoe UI", sans-serif;
    font-size: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 28px;
  }
  .meta, .foot { width: min(390px, 100%); font-size: 0.75rem; line-height: 1.4; }
  .phone { width: min(390px, 100%); background: #1b2421; border-radius: 22px; padding: 8px; margin-top: 12px; }
  .screen { background: #f4f7f5; border-radius: 16px; min-height: 640px; display: flex; flex-direction: column; }
  .bar { min-height: 3rem; display: flex; align-items: center; padding: 0 0.4rem 0 0.8rem; }
  .bar h1 { margin: 0; font-size: 1.15rem; font-weight: 500; flex: 1; }
  .icon { width: 3rem; height: 3rem; border: 0; background: transparent; font-size: 1.1rem; }
  .quiet { margin: 0.6rem 0.9rem 0; font-size: 1rem; line-height: 1.4; overflow-wrap: anywhere; }
  .dock { margin-top: auto; padding: 0.8rem 0.9rem 1rem; }
  .primary { width: 100%; min-height: 3rem; border: 0; border-radius: 1.2rem; background: #0f6e56; color: #fff; font: inherit; font-size: 1rem; }
</style>
</head>
<body>
  <p class="meta"><strong>字号放大 · Android · 示例数据 · 窄窗口。</strong>相对项目记录里的正文约 16px，这一稿放到 150%。只放大失败这一态。长标题仍换行，重试仍留在屏内。这不是动态字体，也不是安卓真机上的系统字号。</p>
  <div class="phone"><div class="screen">
    <header class="bar"><h1>账单</h1><button class="icon" type="button" aria-label="设置">⋮</button></header>
    <p class="quiet">2026年11月家庭水电燃气合缴账单（含滞纳金说明）</p>
    <p class="quiet">失败。这次没有读到账单。可以重试。</p>
    <div class="dock"><button class="primary" type="button">重试</button></div>
  </div></div>
  <p class="foot">色值仍是项目决定：背景 #f4f7f5，主操作 #0f6e56。没有为放大另选一套颜色。四种状态不各做一份放大稿。</p>
</body>
</html>
